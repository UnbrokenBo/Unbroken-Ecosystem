<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbroken Ecosystems</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Unbroken">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
      .hero {
        text-align: center;
        padding: 3rem 1.5rem 2rem;
        max-width: 520px;
        margin: 0 auto;
      }
      .hero h1 {
        font-size: 2.8rem;
        font-weight: 500;
        letter-spacing: -0.03em;
        margin: 0 0 0.3rem;
        color: #fff;
      }
      .hero .tagline {
        color: #ff8c42;
        font-size: 1.1rem;
        margin-bottom: 2rem;
        opacity: 0.9;
      }
      .open-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #333;
        border-radius: 999px;
        padding: 0.85rem 2rem;
        font-size: 1.1rem;
        font-weight: 600;
        text-decoration: none;
      }
      .open-btn:hover {
        background: #222;
        border-color: #ff6b1a;
        color: #ff8c42;
      }
      .section-links {
        margin-top: 2.5rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.8rem;
      }
      .section-links a {
        padding: 0.6rem 1.2rem;
        border: 1px solid #2a1a10;
        border-radius: 8px;
        background: #111;
        color: #ff8c42;
      }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Reelroom</h1>
        <p class="tagline">Lay sound on video</p>
        <a class="open-btn" href="reelroom.html">
            <span style="font-size:1.2rem;">▶</span> Open Reelroom
        </a>
        <div class="section-links">
            <a href="projects.html">Projects</a>
            <a href="studio.html">Music Studio</a>
        </div>
    </div>

    <div class="sages-note" style="margin-top:3rem;">
        <strong>Unbroken Ecosystems</strong> — collaborative tools for the dog-vs-cat COD series, prompts, and local video prep.
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
</body>
</html>
