<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbroken Ecosystems</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Unbroken">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
      .hero {
        text-align: center;
        padding: 4rem 1.5rem 3rem;
        max-width: 480px;
        margin: 0 auto;
      }
      .hero h1 {
        font-size: 3.4rem;
        font-weight: 500;
        letter-spacing: -0.03em;
        margin: 0 0 0.4rem;
        color: #fff;
      }
      .hero .tagline {
        color: #ff8c42;
        font-size: 1.15rem;
        margin-bottom: 2.5rem;
        opacity: 0.9;
      }
      .open-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #333;
        border-radius: 999px;
        padding: 0.9rem 2.2rem;
        font-size: 1.15rem;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 4px 20px rgba(255, 107, 26, 0.15);
      }
      .open-btn:hover {
        background: #222;
        border-color: #ff6b1a;
        color: #ff8c42;
      }
      .links {
        margin-top: 2.5rem;
        font-size: 0.95rem;
      }
      .links a {
        margin: 0 0.6rem;
        color: #ff8c42;
      }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Reelroom</h1>
        <p class="tagline">Lay sound on video</p>

        <a class="open-btn" href="reelroom.html">
            <span style="font-size:1.3rem;">▶</span> Open
        </a>

        <div class="links">
            <a href="projects.html">Projects</a>
            <a href="studio.html">Studio</a>
        </div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
</body>
</html>
